name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build Release Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: swagtype-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: swagtype-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: swagtype-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: swagtype-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Use Rust 1.85.0
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}

      - name: Build Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename Binary
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            mv target/${{ matrix.target }}/release/swagtype.exe target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          else
            mv target/${{ matrix.target }}/release/swagtype target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/swagtype-linux-x86_64/*
            artifacts/swagtype-macos-x86_64/*
            artifacts/swagtype-macos-aarch64/*
            artifacts/swagtype-windows-x86_64.exe/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
